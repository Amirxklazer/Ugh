name: Build RumbleNX

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20240202
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 libs
        run: |
          PM=$(command -v dkp-pacman || command -v pacman)
          $PM -Syu --noconfirm || true
          $PM -S --noconfirm --needed switch-sdl2 switch-sdl2_ttf switch-freetype switch-harfbuzz switch-libpng switch-bzip2 switch-zlib

      - name: Build
        run: make

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: RumbleNX
          path: RumbleNX.nro
